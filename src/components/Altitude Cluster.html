<style>
/* Layout: one dark instrument cluster. Climb-rate dial left, big rolling altitude + profile graph in the centre, elevation dial right. Dials drop away on narrow widths. */
:root {
  --bg: #050506;
  --panel: #141415;
  --edge: #2a2a2d;
  --track: #232326;
  --ink: #f2f2f3;
  --muted: #9a9a9f;
  --climb: #4ade9a;
  --drop: #ff7a3d;
  --warn: #ff3b30;
  --font-ui: 'Saira', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-cap: 'Saira Condensed', 'Saira', system-ui, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-ui);
  padding-inline: 16px;
  padding-block: 20px 28px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
}
.wrap { width: 100%; max-width: 1040px; display: flex; flex-direction: column; gap: 14px; }

.head { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 18px; }
.head h1 { margin: 0; font: 600 13px/1 var(--font-cap); letter-spacing: .22em; text-transform: uppercase; color: var(--muted); }
.head p { margin: 0; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.head p b { color: var(--ink); font-weight: 500; }

/* ---------- cluster ---------- */
.alt {
  position: relative;
  container-type: inline-size;
  display: flex; align-items: center; justify-content: center;
  gap: clamp(8px, 2cqw, 28px);
  padding: 22px 18px 20px;
  overflow: hidden;
  border-radius: 18px;
  border: 1px solid #1c1c1e;
  background:
    radial-gradient(70% 90% at 50% 0%, rgba(255,255,255,.06), transparent 70%),
    linear-gradient(180deg, #101011, #050506);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 24px 60px rgba(0,0,0,.5);
}
.alt > * { position: relative; z-index: 1; }
.alt::before, .alt::after {
  content: ''; position: absolute; top: 10%; bottom: 10%; width: 32%; z-index: 0; pointer-events: none;
  border: 1px solid rgba(255,255,255,.08);
  background: linear-gradient(180deg, rgba(30,30,32,.7), rgba(8,8,9,.2));
}
.alt::before { left: -6%; border-left: 0; border-radius: 0 60% 60% 0 / 0 50% 50% 0; }
.alt::after { right: -6%; border-right: 0; border-radius: 60% 0 0 60% / 50% 0 0 50%; }

@container (max-width: 700px) { .dial { display: none; } }

/* dials */
.dial { flex: 0 1 190px; width: 190px; min-width: 0; aspect-ratio: 1; filter: drop-shadow(0 6px 14px rgba(0,0,0,.65)); }
.dial .bezel { fill: none; stroke-width: 2.5; }
.dial .face { stroke: #050506; stroke-width: 1; }
.dial .track, .dial .fill { fill: none; stroke-width: 4; stroke-linecap: round; }
.dial .track { stroke: var(--track); }
.dial .fill { stroke: var(--climb); filter: drop-shadow(0 0 3px var(--climb)); }
.dial .fill.neg { stroke: var(--drop); filter: drop-shadow(0 0 3px var(--drop)); }
.dial line.maj { stroke: var(--ink); stroke-width: 1.5; }
.dial line.min { stroke: #bdbdc2; stroke-width: .8; opacity: .65; }
.dial .lbl { fill: var(--ink); font: 600 11px var(--font-ui); text-anchor: middle; dominant-baseline: central; font-variant-numeric: tabular-nums; }
.dial .cap, .dial .unit { fill: var(--muted); text-anchor: middle; font-weight: 500; }
.dial .cap { font-size: 7px; letter-spacing: .14em; }
.dial .unit { font-size: 8px; }
.dial .pill rect { fill: rgba(14,14,15,.92); stroke: #343437; stroke-width: .8; }
.dial .pill .pc { fill: var(--muted); font-size: 5px; letter-spacing: .12em; text-anchor: middle; dominant-baseline: central; }
.dial .pill .pv { fill: var(--ink); font: 600 9px var(--font-ui); text-anchor: middle; dominant-baseline: central; font-variant-numeric: tabular-nums; }
.needle { transform-box: view-box; transform-origin: 50% 50%; transform: rotate(calc(135deg + var(--f, 0) * 270deg)); transition: transform .35s cubic-bezier(.2,.8,.2,1); filter: drop-shadow(0 1px 2px rgba(0,0,0,.8)); }
.needle polygon { fill: #f5f5f6; }
.hub { stroke: #d0d0d4; stroke-width: 1; }
.hub-dot { fill: #242426; }

/* centre console */
.mid { flex: 1 1 380px; max-width: 520px; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
.mid::before {
  content: ''; position: absolute; z-index: -1; inset: 18% -3% 0;
  clip-path: polygon(7% 0, 93% 0, 100% 100%, 0 100%);
  background: linear-gradient(180deg, rgba(255,255,255,.055), rgba(255,255,255,0) 85%);
}
.seg { display: grid; grid-template-columns: repeat(12, 1fr); gap: 5px; padding: 0 6%; }
.seg i { position: relative; height: 8px; border-radius: 3px; transform: skewX(-22deg); background: linear-gradient(180deg,#2b2b2e,#161617); border: 1px solid #36363a; }
.seg i::after { content: ''; position: absolute; inset: -1px; border-radius: inherit; background: linear-gradient(180deg,#b9ffe0,var(--climb)); box-shadow: 0 0 8px var(--climb); opacity: var(--on, 0); transition: opacity .2s linear; }

.readout { display: grid; justify-items: center; gap: 4px; padding-bottom: 12px; border-bottom: 1px solid transparent; border-image: linear-gradient(90deg, transparent, var(--climb), transparent) 1; }
.label { font: 600 14px/1 var(--font-cap); letter-spacing: .32em; text-transform: uppercase; color: var(--climb); filter: brightness(1.15); padding-left: .32em; }
.big { display: flex; align-items: flex-end; justify-content: center; gap: 10px; }
.digits { display: flex; font-size: clamp(64px, 20cqw, 112px); font-weight: 800; line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; text-shadow: 0 2px 18px rgba(255,255,255,.14); }
.col { display: block; width: .64em; height: 1em; overflow: hidden; }
.strip { display: block; transition: transform .22s cubic-bezier(.2,.8,.2,1); will-change: transform; }
.strip span { display: block; height: 1em; line-height: 1; text-align: center; }
.unit-m { font-size: clamp(26px, 8cqw, 44px); font-weight: 600; color: var(--muted); line-height: 1.15; }
.trend { display: flex; align-items: center; gap: 8px; font-weight: 600; font-variant-numeric: tabular-nums; min-height: 22px; }
.trend .arrow { width: 0; height: 0; border-left: 7px solid transparent; border-right: 7px solid transparent; border-bottom: 11px solid var(--climb); }
.trend.down .arrow { border-bottom: 0; border-top: 11px solid var(--drop); }
.trend .v { color: var(--climb); font-size: 18px; }
.trend.down .v { color: var(--drop); }
.trend .w { color: var(--muted); font-size: 12px; font-weight: 500; letter-spacing: .06em; }
.asl { font: 500 11px/1 var(--font-cap); letter-spacing: .3em; text-transform: uppercase; color: var(--muted); }

/* graph */
.graph { border: 1px solid #2c2c30; border-radius: 12px; background: linear-gradient(180deg, rgba(40,40,44,.45), rgba(10,10,11,.9)); box-shadow: inset 0 1px 0 rgba(255,255,255,.06); padding: 8px 6px 4px 8px; }
.graph svg { display: block; width: 100%; height: auto; overflow: visible; }
.g-grid { stroke: #ffffff; stroke-opacity: .07; stroke-width: 1; }
.g-tick { fill: var(--muted); font: 500 12px var(--font-ui); font-variant-numeric: tabular-nums; }
.g-ghost { fill: none; stroke: #ffffff; stroke-opacity: .16; stroke-width: 1.5; stroke-linejoin: round; }
.g-line { fill: none; stroke: var(--climb); stroke-width: 2.2; stroke-linejoin: round; stroke-linecap: round; filter: drop-shadow(0 0 4px rgba(74,222,154,.6)); }
.g-dot { fill: var(--climb); stroke: #eafff5; stroke-width: 2; filter: drop-shadow(0 0 6px var(--climb)); }
.g-pulse { fill: none; stroke: var(--climb); stroke-width: 1.5; transform-box: fill-box; transform-origin: center; animation: pulse 1.8s ease-out infinite; }
@keyframes pulse { from { transform: scale(1); opacity: .8; } to { transform: scale(3.4); opacity: 0; } }
.g-start { stroke: var(--drop); stroke-width: 1; stroke-dasharray: 3 4; opacity: .7; }
.g-start-t { fill: var(--drop); font: 600 10px var(--font-ui); letter-spacing: .1em; }

/* tiles */
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.tile { display: flex; align-items: center; gap: 9px; padding: 6px 10px 6px 6px; border: 1px solid #333336; border-radius: 12px; background: linear-gradient(180deg, rgba(50,50,54,.55), rgba(16,16,18,.9)); box-shadow: inset 0 1px 0 rgba(255,255,255,.07); min-width: 0; }
.ico { display: grid; place-items: center; flex: none; width: 34px; height: 34px; border-radius: 10px; color: var(--climb); background: linear-gradient(180deg,#242427,#141415); border: 1px solid #39393d; }
.ico svg { width: 18px; height: 18px; }
.tx { display: flex; flex-direction: column; min-width: 0; }
.tx em { font-style: normal; color: var(--muted); font-size: 11px; letter-spacing: .04em; white-space: nowrap; }
.tx b { font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
.tx b small { font-size: 11px; font-weight: 500; color: var(--muted); }

.bar { height: 6px; border-radius: 3px; background: #1a1a1c; border: 1px solid #2e2e31; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; border-radius: inherit; background: linear-gradient(90deg, var(--climb), #fff); box-shadow: 0 0 8px var(--climb); }

/* controls */
.controls { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; }
.tabs { display: inline-flex; padding: 3px; gap: 2px; border: 1px solid var(--edge); border-radius: 10px; background: var(--panel); }
.tabs button, .play { font: 600 12px/1 var(--font-ui); letter-spacing: .06em; color: var(--muted); background: transparent; border: 0; border-radius: 8px; padding: 9px 13px; cursor: pointer; }
.tabs button[aria-pressed="true"] { color: var(--ink); background: #2a2a2e; box-shadow: inset 0 0 0 1px #3c3c41; }
.tabs button:hover, .play:hover { color: var(--ink); }
.play { border: 1px solid var(--edge); background: var(--panel); color: var(--ink); min-width: 74px; }
.tabs button:focus-visible, .play:focus-visible, .scrub:focus-visible { outline: 2px solid var(--climb); outline-offset: 2px; }
.scrub { flex: 1 1 200px; min-width: 0; accent-color: var(--climb); height: 24px; }
.clock { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; min-width: 96px; text-align: right; }

.note { margin: 0; max-width: 78ch; font-size: 12px; line-height: 1.55; color: var(--muted); }
.note b { color: var(--ink); font-weight: 600; }
.tag { display: inline-block; padding: 2px 6px; border: 1px solid #3a3a3f; border-radius: 5px; font: 600 10px/1.2 var(--font-cap); letter-spacing: .14em; text-transform: uppercase; color: var(--drop); vertical-align: 1px; }

@container (max-width: 480px) {
  .tiles { grid-template-columns: 1fr 1fr; }
  .tiles .tile:last-child { grid-column: 1 / -1; }
}
@media (prefers-reduced-motion: reduce) {
  .needle, .strip, .seg i::after { transition: none; }
  .g-pulse { animation: none; }
}
</style>

      s += '<text class="lbl" x="' + p[0].toFixed(2) + '" y="' + p[1].toFixed(2) + '">' + l + '</text>';
    });
    s += '<text class="cap" x="100" y="130">' + title + '</text><text class="unit" x="100" y="142">' + unit + '</text>';
    s += '<g class="pill"><rect x="72" y="154" width="56" height="24" rx="8"/><text class="pc" x="100" y="162">' + pill + '</text><text class="pv" id="' + uid + 'pv" x="100" y="171">—</text></g>';
    s += '<g class="needle" id="' + uid + 'n"><polygon points="82,98.2 161,99.5 161,100.5 82,101.8"/></g>';
    s += '<circle class="hub" cx="100" cy="100" r="9" fill="url(#' + uid + 'h)"/><circle class="hub-dot" cx="100" cy="100" r="3"/>';
    return s;
  }
  function setDial(uid, f, from) {
    f = clamp(f, 0, 1);
    $(uid + 'n').style.setProperty('--f', f);
    var fill = $(uid + 'fill');
    if (Math.abs(f - from) < .004) fill.setAttribute('d', ''); else fill.setAttribute('d', arc(from, f, 91));
    fill.setAttribute('class', 'fill' + (f < from ? ' neg' : ''));
  }
  function buildDials(m) {
    var s = m.scale;
    $('dialL').innerHTML = dialStatic('dl', ['−' + s, '−' + s / 2, '0', '+' + s / 2, '+' + s], 5, 'CLIMB RATE', 'm / min', 'VERTICAL', null);
    var lab = []; for (var k = 0; k <= 3000; k += 500) lab.push(k === 0 ? '0' : (k / 1000).toFixed(1).replace('.0', ''));
    $('dialR').innerHTML = dialStatic('dr', lab, 5, 'ELEVATION', 'km', 'SEA LEVEL', null);
  }

  /* ---------- big rolling number ---------- */
  var digitCount = 0;
  function buildDigits(n) {
    var h = '';
    for (var i = 0; i < n; i++) {
      var col = '';
      for (var d = 0; d < 10; d++) col += '<span>' + d + '</span>';
      h += '<span class="col"><span class="strip">' + col + '</span></span>';
    }
    $('digits').innerHTML = h;
    digitCount = n;
  }
  function setBig(v) {
    var s = String(Math.max(0, Math.round(v)));
    var width = Math.max(s.length, 3);
    if (width !== digitCount) buildDigits(width);
    while (s.length < width) s = '0' + s;
    var strips = $('digits').querySelectorAll('.strip');
    var lead = true;
    for (var i = 0; i < strips.length; i++) {
      var d = +s[i];
      strips[i].style.transform = 'translateY(' + (-d) + 'em)';
      var hide = lead && d === 0 && i < strips.length - 3;
      if (d !== 0) lead = false;
      strips[i].parentNode.style.opacity = hide ? '0' : '1';
    }
    $('cluster').setAttribute('aria-label', 'Altitude ' + Math.round(v) + ' meters above sea level');
  }

  /* ---------- LED segments ---------- */
  var segHtml = ''; for (var q = 0; q < 12; q++) segHtml += '<i></i>';
  $('seg').innerHTML = segHtml;
  var segs = $('seg').children;

  /* ---------- chart ---------- */
  var W = 640, H = 210, PL = 8, PR = 52, PT = 14, PB = 28;
  var NS = 'http://www.w3.org/2000/svg';
  var chartCache = null;
  function niceStep(span, target) {
    var raw = span / target, mag = Math.pow(10, Math.floor(Math.log10(raw))), r = raw / mag;
    return (r < 1.5 ? 1 : r < 3 ? 2 : r < 7 ? 5 : 10) * mag;
  }
  function fmtTick(v, step) { return step < 1 ? v.toFixed(1) : String(Math.round(v)); }
  function buildChart(m) {
    var lo = Math.min.apply(null, m.alt), hi = Math.max.apply(null, m.alt);
    var span = Math.max(hi - lo, m.real ? 3 : 100);
    var mid = (hi + lo) / 2;
    lo = mid - span * .62; hi = mid + span * .62;
    var step = niceStep(hi - lo, 4);
    var y0 = Math.floor(lo / step) * step, y1 = Math.ceil(hi / step) * step;
    var X = function (t) { return PL + (W - PL - PR) * t / m.dur; };
    var Y = function (a) { return PT + (H - PT - PB) * (1 - (a - y0) / (y1 - y0)); };
    var g = '';
    for (var v = y0; v <= y1 + 1e-9; v += step) {
      g += '<line class="g-grid" x1="' + PL + '" x2="' + (W - PR) + '" y1="' + Y(v).toFixed(1) + '" y2="' + Y(v).toFixed(1) + '"/>';
      g += '<text class="g-tick" x="' + (W - PR + 8) + '" y="' + (Y(v) + 4).toFixed(1) + '">' + fmtTick(v, step) + '</text>';
    }
    var xt = m.real ? [0, 1, 2, 3, 4, 5, 6] : [0, 3600, 7200, 10800];
    xt.forEach(function (t) {
      if (t > m.dur + 1e-6) return;
      var lab = m.real ? t + ' s' : (t / 3600) + ' h';
      g += '<line class="g-grid" x1="' + X(t).toFixed(1) + '" x2="' + X(t).toFixed(1) + '" y1="' + PT + '" y2="' + (H - PB) + '"/>';
      g += '<text class="g-tick" x="' + X(t).toFixed(1) + '" y="' + (H - 8) + '" text-anchor="' + (t === 0 ? 'start' : 'middle') + '">' + lab + '</text>';
    });
    var pts = m.t.map(function (t, i) { return X(t).toFixed(1) + ',' + Y(m.alt[i]).toFixed(1); });
    var line = 'M' + pts.join('L');
    var area = line + 'L' + X(m.dur).toFixed(1) + ',' + (H - PB) + 'L' + X(0).toFixed(1) + ',' + (H - PB) + 'Z';
    var sy = Y(m.alt[0]).toFixed(1);
    var html = '<defs><linearGradient id="ar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4ade9a" stop-opacity=".42"/><stop offset="1" stop-color="#4ade9a" stop-opacity="0"/></linearGradient>' +
      '<clipPath id="cp"><rect id="cpr" x="0" y="0" width="0" height="' + H + '"/></clipPath></defs>' +
      g +
      '<line class="g-start" x1="' + PL + '" x2="' + (W - PR) + '" y1="' + sy + '" y2="' + sy + '"/>' +
      '<path class="g-ghost" d="' + line + '"/>' +
      '<g clip-path="url(#cp)"><path d="' + area + '" fill="url(#ar)"/><path class="g-line" d="' + line + '"/></g>' +
      '<circle class="g-pulse" id="gp" r="5" cx="0" cy="0"/><circle class="g-dot" id="gd" r="5" cx="0" cy="0"/>';
    $('chart').innerHTML = html;
    chartCache = { X: X, Y: Y, m: m };
  }
  function updateChart(sec, alt) {
    var c = chartCache; if (!c) return;
    var x = c.X(sec), y = c.Y(alt);
    $('cpr').setAttribute('width', x.toFixed(1));
    ['gd', 'gp'].forEach(function (id) { $(id).setAttribute('cx', x.toFixed(1)); $(id).setAttribute('cy', y.toFixed(1)); });
  }

  /* ---------- derived values ---------- */
  function isaPressure(h) { return 1013.25 * Math.pow(1 - 2.25577e-5 * h, 5.25588); }
  function isaTemp(h) { return 15 - 0.0065 * h; }
  function sign(v, d) { return (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v).toFixed(d); }
  function fmtClock(m, sec) {
    if (m.real) return sec.toFixed(1) + ' s / ' + m.dur.toFixed(1) + ' s';
    var mm = Math.floor(sec / 60), h = Math.floor(mm / 60);
    return h + ':' + String(mm % 60).padStart(2, '0') + ' / 3:00 h';
  }

  /* ---------- state + render ---------- */
  var key = 'clip', M = modes.clip;
  var sec = 0, playing = !reduce, introT0 = 0, intro = false, holdUntil = 0, last = 0;

  function render(displayAlt, s) {
    var m = M;
    setBig(displayAlt);
    var alt = altAt(m, s);
    var w = m.rateWin / 2;
    var rate = (altAt(m, Math.min(m.dur, s + w)) - altAt(m, Math.max(0, s - w))) / (Math.min(m.dur, s + w) - Math.max(0, s - w)) * 60;
    var gain = alt - m.alt[0];

    // trend chip
    var tw = m.trendWin, delta, wl;
    if (tw) { delta = alt - altAt(m, Math.max(0, s - tw)); wl = '(1H)'; }
    else { delta = gain; wl = '(CLIP)'; }
    var tr = $('trend'); tr.className = 'trend' + (delta < -0.005 ? ' down' : '');
    $('tv').textContent = sign(delta, m.real ? 1 : 0) + ' m'; $('tw').textContent = wl;

    // dials
    setDial('dl', .5 + rate / (2 * m.scale), .5);
    $('dlpv').textContent = sign(rate, m.real ? 1 : 1);
    setDial('dr', alt / 3000, 0);
    $('drpv').textContent = Math.round(alt) + ' m';

    // segments: position within the profile's height range
    var lo = Math.min.apply(null, m.alt), hi = Math.max.apply(null, m.alt);
    var frac = hi > lo ? (alt - lo) / (hi - lo) : 0;
    for (var i = 0; i < segs.length; i++) segs[i].style.setProperty('--on', clamp(frac * 12 - i, 0, 1));

    // tiles
    $('tGain').innerHTML = sign(gain, m.real ? 1 : 0) + ' <small>m</small>';
    if (WEATHER) {
      $('tPLabel').textContent = 'Pressure'; $('tPress').innerHTML = Math.round(WEATHER.pressure) + ' <small>hPa</small>';
      $('tTLabel').textContent = 'Temperature'; $('tTemp').innerHTML = WEATHER.temp.toFixed(1) + ' <small>°C</small>';
    } else {
      $('tPLabel').textContent = 'Air pressure · ISA'; $('tPress').innerHTML = Math.round(isaPressure(alt)) + ' <small>hPa</small>';
      $('tTLabel').textContent = 'Air temp · ISA'; $('tTemp').innerHTML = sign(isaTemp(alt), 1).replace('+', '') + ' <small>°C</small>';
    }

    $('prog').style.width = (s / m.dur * 100).toFixed(1) + '%';
    $('clock').textContent = fmtClock(m, s);
    $('scrub').value = Math.round(s / m.dur * 1000);
    updateChart(s, alt);
  }

  function ease(t) { return 1 - Math.pow(1 - t, 3); }
  function frame(now) {
    var dt = Math.min(.1, (now - last) / 1000); last = now;
    if (intro) {
      var p = clamp((now - introT0) / 1500, 0, 1);
      render(altAt(M, 0) * ease(p), 0);
      if (p >= 1) { intro = false; sec = 0; }
    } else if (playing) {
      if (holdUntil) {
        if (now >= holdUntil) { holdUntil = 0; sec = 0; startIntro(); }
      } else {
        sec += dt * (M.dur / M.loopSec);
        if (sec >= M.dur) { sec = M.dur; holdUntil = now + 1600; }
        render(altAt(M, sec), sec);
      }
    }
    requestAnimationFrame(frame);
  }
  function startIntro() {
    if (reduce) { sec = 0; render(altAt(M, 0), 0); return; }
    intro = true; introT0 = performance.now(); render(0, 0);
  }

  function setMode(k) {
    key = k; M = modes[k];
    $('mClip').setAttribute('aria-pressed', k === 'clip');
    $('mHike').setAttribute('aria-pressed', k === 'hike');
    buildDials(M); buildChart(M);
    holdUntil = 0; sec = 0;
    $('note').innerHTML = k === 'clip'
      ? '<b>Measured.</b> Altitude, from the GPS track recorded inside your GoPro clip: 65 readings over 6.4 s at 10 Hz, 3D fix. The camera was nearly level, so the graph shows a slight drop of about 1.5 m. Pressure and temperature are <b>standard-atmosphere (ISA) values</b> computed from that altitude. They are not measured weather.'
      : '<span class="tag">Example</span> A made-up 3-hour climb from 1,890 m to 2,485 m, played at speed, to show how the graph behaves on a real ascent. It is not recorded data. Pressure and temperature are <b>standard-atmosphere (ISA) values</b> computed from altitude.';
    startIntro();
  }

  $('mClip').onclick = function () { setMode('clip'); };
  $('mHike').onclick = function () { setMode('hike'); };
  $('play').onclick = function () {
    playing = !playing; $('play').textContent = playing ? 'Pause' : 'Play';
    if (playing && sec >= M.dur) { sec = 0; startIntro(); }
  };
  $('scrub').oninput = function () {
    intro = false; holdUntil = 0;
    sec = this.value / 1000 * M.dur;
    playing = false; $('play').textContent = 'Play';
    render(altAt(M, sec), sec);
  };
  $('play').textContent = playing ? 'Pause' : 'Play';

  setMode('clip');
  last = performance.now();
  requestAnimationFrame(frame);
})();
</script>

</body></html>
